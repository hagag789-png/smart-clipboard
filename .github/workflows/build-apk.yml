name: Build APK & deploy web
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo '```'; grep -v '^\s*at ' build.log | tail -c 50000; echo '```'; } > body.md
          gh issue create --title "Build failed $(date -u +%FT%TZ)" --body-file body.md
      - uses: actions/upload-artifact@v4
        with: { name: SmartClipboard-apk, path: app/build/outputs/apk/release/app-release.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/release/app-release.apk SmartClipboard.apk
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SmartClipboard.apk --title "Smart Clipboard v$V" --notes "نزّل SmartClipboard.apk وثبّته على هاتف أندرويد."
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/src/main/assets }
      - id: d
        uses: actions/deploy-pages@v4
